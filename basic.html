
<!DOCTYPE html>
<html>
<head>
    <title>My Webpage</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
            background-color: lightgray;
        }

        header {
            background-color: navy;
            color: white;
            text-align: center;
            padding: 15px;
        }

        nav {
            background-color: black;
            padding: 10px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 15px;
        }

        section {
            padding: 20px;
            text-align: center;
        }

        img {
            width: 200px;
            height: 120px;
        }

        table {
            margin: auto;
            border-collapse: collapse;
            width: 60%;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
        }

        th {
            background-color: navy;
            color: white;
        }

        footer {
            background-color: black;
            color: white;
            text-align: center;
            padding: 10px;
        }
    </style>
</head>

<body>

    <header>
        <h1>My Webpage</h1>
        <p>Welcome to my website</p>
    </header>

    <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#students">Students</a>
    </nav>

    <section id="home">
        <h2>Home</h2>
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRyzREh-2-LfZF08DEOQaghiIg4k1PbKF40VvReuVxYjQ&s=10/200x120"
             alt="Sample image">
        <p>This is a simple HTML5 webpage.</p>
    </section>

    <section id="about">
        <h2>About Us</h2>
        <p>We are learning HTML5 and CSS3.</p>
    </section>

    <section id="students">
        <h2>Student Table</h2>

        <table>
            <tr>
                <th>Roll No</th>
                <th>Name</th>
                <th>Marks</th>
            </tr>

            <tr>
                <td>1</td>
                <td>Rahul</td>
                <td>85</td>
            </tr>

            <tr>
                <td>2</td>
                <td>Amit</td>
                <td>90</td>
            </tr>
        </table>
    </section>

    <footer>
        <p>Copyright 2026 My Webpage</p>
    </footer>

</body>
</html>
