
<!DOCTYPE html>
<html>
<head>
    <title>Student Registration</title>

    <style>
        body {
            font-family: Arial;
            background-color: lightgray;
            margin: 0;
        }

        header {
            background-color: navy;
            color: white;
            text-align: center;
            padding: 15px;
        }

        nav {
            background-color: black;
            padding: 12px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 15px;
        }

        section {
            background-color: white;
            width: 350px;
            margin: 30px auto;
            padding: 20px;
            border-radius: 10px;
        }

        input, select {
            width: 100%;
            padding: 8px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        button {
            background-color: navy;
            color: white;
            padding: 10px;
            border: none;
            width: 100%;
        }

        footer {
            background-color: black;
            color: white;
            text-align: center;
            padding: 10px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Student Registration Form</h1>
    </header>

    <nav>
        <a href="#home">Home</a>
        <a href="#form">Register</a>
        <a href="#contact">Contact</a>
    </nav>

    <section id="home">
        <h2>Welcome</h2>
        <p>Register here using the form below.</p>
    </section>

    <section id="form">
        <h2>Registration Form</h2>

        <form>
            <label>Name:</label>
            <input type="text" placeholder="Enter your name" required>

            <label>Email:</label>
            <input type="email" placeholder="Enter your email" required>

            <label>Password:</label>
            <input type="password" placeholder="Enter password" required>

            <label>Gender:</label>
            <select>
                <option>Select Gender</option>
                <option>Male</option>
                <option>Female</option>
                <option>Other</option>
            </select>

            <label>Age:</label>
            <input type="number" placeholder="Enter your age">

            <button type="submit">Register</button>
        </form>
    </section>

    <footer id="contact">
        <p>Contact: student@example.com</p>
        <p>Copyright 2026</p>
    </footer>

</body>
</html>
